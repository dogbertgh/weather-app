<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Now</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; color: #fff;
      background: linear-gradient(160deg, #4a90d9, #1e3c72);
      display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem;
    }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input, button { font-size: 1rem; padding: .5rem .8rem; border-radius: 8px; border: none; }
    button { background: #ffd54f; cursor: pointer; font-weight: 600; }
    .unit-toggle { display: flex; margin-left: .5rem; border-radius: 8px; overflow: hidden; }
    .unit-toggle button { border-radius: 0; background: rgba(255,255,255,.2); color: #fff; }
    .unit-toggle button.active { background: #ffd54f; color: #000; }
    .current { text-align: center; }
    .current .icon { font-size: 6rem; line-height: 1; }
    .current .temp { font-size: 5rem; font-weight: 700; }
    .current .desc { font-size: 1.4rem; opacity: .9; }
    .current .place { opacity: .8; margin-top: .3rem; }
    .forecast { display: grid; grid-template-columns: repeat(7, 1fr); gap: .6rem; margin-top: 2rem; width: 100%; max-width: 760px; }
    .day { background: rgba(255,255,255,.15); border-radius: 12px; padding: .8rem .4rem; text-align: center; }
    .day .icon { font-size: 2.2rem; margin: .3rem 0; }
    .bar { position: relative; height: 90px; width: 8px; margin: .4rem auto; background: rgba(255,255,255,.2); border-radius: 4px; }
    .bar span { position: absolute; left: 0; right: 0; border-radius: 4px; background: linear-gradient(#ff7043, #ffd54f, #4fc3f7); }
    .hi { font-weight: 700; } .lo { opacity: .75; }
    .precip { font-size: .8rem; opacity: .85; }
    #status { opacity: .85; }
    .alerts { width: 100%; max-width: 760px; margin-top: 2rem; }
    .alert { border-radius: 12px; margin-bottom: .6rem; background: #616161; color: #fff; }
    .alert summary { cursor: pointer; padding: .8rem 1rem; font-weight: 700; }
    .alert .headline { font-weight: 400; font-size: .9rem; opacity: .9; margin-top: .2rem; }
    .alert .body { padding: 0 1rem 1rem; font-size: .9rem; white-space: pre-wrap; }
    .alert .body h4 { margin: .8rem 0 .3rem; }
    .sev-Extreme { background: #8e0000; }
    .sev-Severe { background: #d32f2f; }
    .sev-Moderate { background: #ef6c00; }
    .sev-Minor { background: #fdd835; color: #000; }
    .alerts-meta { font-size: .8rem; opacity: .8; text-align: center; }
    .alerts-meta a { color: inherit; }
    @media (max-width: 600px) { .forecast { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <form id="search">
    <input id="city" placeholder="Search a city…" aria-label="City">
    <button type="submit">Go</button>
    <div class="unit-toggle" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="F">°F</button>
      <button type="button" data-unit="C">°C</button>
    </div>
  </form>
  <div id="status">Getting your location…</div>
  <div class="current" id="current" hidden>
    <div class="icon" id="cur-icon"></div>
    <div class="temp" id="cur-temp"></div>
    <div class="desc" id="cur-desc"></div>
    <div class="place" id="cur-place"></div>
  </div>
  <div class="forecast" id="forecast"></div>
  <div class="alerts" id="alerts" aria-live="polite"></div>

  <script>
    // WMO weather codes -> [emoji, description]
    const CODES = {
      0: ['☀️', 'Clear sky'], 1: ['🌤️', 'Mainly clear'], 2: ['⛅', 'Partly cloudy'], 3: ['☁️', 'Overcast'],
      45: ['🌫️', 'Fog'], 48: ['🌫️', 'Rime fog'],
      51: ['🌦️', 'Light drizzle'], 53: ['🌦️', 'Drizzle'], 55: ['🌧️', 'Heavy drizzle'],
      56: ['🌧️', 'Freezing drizzle'], 57: ['🌧️', 'Freezing drizzle'],
      61: ['🌦️', 'Light rain'], 63: ['🌧️', 'Rain'], 65: ['🌧️', 'Heavy rain'],
      66: ['🌧️', 'Freezing rain'], 67: ['🌧️', 'Freezing rain'],
      71: ['🌨️', 'Light snow'], 73: ['🌨️', 'Snow'], 75: ['❄️', 'Heavy snow'], 77: ['🌨️', 'Snow grains'],
      80: ['🌦️', 'Rain showers'], 81: ['🌧️', 'Rain showers'], 82: ['⛈️', 'Violent showers'],
      85: ['🌨️', 'Snow showers'], 86: ['❄️', 'Snow showers'],
      95: ['⛈️', 'Thunderstorm'], 96: ['⛈️', 'Thunderstorm w/ hail'], 99: ['⛈️', 'Thunderstorm w/ hail'],
    };
    const weather = code => CODES[code] || ['🌡️', 'Unknown'];
    const $ = id => document.getElementById(id);

    // Data is always fetched in Fahrenheit and converted for display, so toggling needs no refetch.
    let unit = localStorage.getItem('unit') === 'C' ? 'C' : 'F';
    let lastData = null, lastPlace = '';
    const toUnit = f => unit === 'C' ? (f - 32) * 5 / 9 : f;
    const fmt = f => Math.round(toUnit(f));

    function setUnit(u) {
      unit = u;
      localStorage.setItem('unit', u);
      document.querySelectorAll('.unit-toggle button').forEach(b => {
        b.classList.toggle('active', b.dataset.unit === u);
        b.setAttribute('aria-pressed', b.dataset.unit === u);
      });
      if (lastData) render();
    }
    document.querySelectorAll('.unit-toggle button').forEach(b =>
      b.addEventListener('click', () => setUnit(b.dataset.unit)));
    setUnit(unit);

    // Auto-refresh intervals. Alerts change quickly; the forecast doesn't.
    const ALERTS_EVERY = 2 * 60 * 1000, FORECAST_EVERY = 15 * 60 * 1000;
    let loc = null, forecastAt = 0, alertsAt = 0;

    function loadWeather(lat, lon, placeName) {
      loc = { lat, lon, place: placeName };
      $('alerts').innerHTML = '';
      $('status').textContent = 'Loading weather…';
      refreshForecast();
      refreshAlerts();
    }

    async function refreshForecast() {
      const target = loc;
      forecastAt = Date.now();
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${target.lat}&longitude=${target.lon}` +
        `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
        `&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`;
      try {
        const data = await (await fetch(url)).json();
        if (target !== loc) return; // user switched locations mid-request
        lastData = data;
        lastPlace = target.place;
        target.tz = data.timezone;
        $('status').textContent = '';
        render();
      } catch (e) {
        // On a background refresh, keep showing the last good data.
        if (target === loc && !lastData) $('status').textContent = 'Could not load weather. Please try again.';
      }
    }

    // NWS watches/warnings/advisories. US locations only; NWS returns 400 for points outside its coverage.
    const SEVERITY_RANK = { Extreme: 0, Severe: 1, Moderate: 2, Minor: 3, Unknown: 4 };
    const escapeHtml = str => String(str ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    // Show alert times in the location's timezone (from Open-Meteo) once known, always with the zone abbreviation.
    const fmtTime = iso => new Date(iso).toLocaleString('en-US',
      { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: loc?.tz, timeZoneName: 'short' });

    async function refreshAlerts() {
      const target = loc;
      alertsAt = Date.now();
      // NWS accepts at most 4 decimal places.
      const url = `https://api.weather.gov/alerts/active?point=${target.lat.toFixed(4)},${target.lon.toFixed(4)}`;
      try {
        const res = await fetch(url, { headers: { Accept: 'application/geo+json' } });
        if (target !== loc) return;
        if (res.status === 400) { $('alerts').innerHTML = ''; return; } // outside NWS coverage
        if (!res.ok) throw new Error(`NWS ${res.status}`);
        renderAlerts((await res.json()).features.map(f => f.properties));
      } catch (e) {
        // Keep whatever alerts are already shown rather than blanking them on a transient error.
        console.warn('Could not load NWS alerts', e);
      }
    }

    function renderAlerts(alerts) {
      // Keep expanded alerts expanded across refreshes.
      const open = new Set([...document.querySelectorAll('.alert[open]')].map(el => el.dataset.id));
      alerts.sort((a, b) => (SEVERITY_RANK[a.severity] ?? 4) - (SEVERITY_RANK[b.severity] ?? 4));
      const updated = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      const meta = `<div class="alerts-meta">${alerts.length ? '' : 'No active NWS alerts · '}` +
        `Updated ${updated} · Always check <a href="https://www.weather.gov" target="_blank" rel="noopener">weather.gov</a> for official alerts</div>`;
      $('alerts').innerHTML = alerts.map(a => {
        const until = a.ends || a.expires;
        return `<details class="alert sev-${escapeHtml(a.severity)}" data-id="${escapeHtml(a.id)}" ${open.has(a.id) ? 'open' : ''}>
          <summary>⚠️ ${escapeHtml(a.event)}${until ? ` until ${fmtTime(until)}` : ''}
            <div class="headline">${escapeHtml(a.headline)}</div>
          </summary>
          <div class="body">${escapeHtml(a.description)}${a.instruction ? `<h4>What to do</h4>${escapeHtml(a.instruction)}` : ''}
            <h4>Issued by</h4>${escapeHtml(a.senderName)}</div>
        </details>`;
      }).join('') + meta;
    }

    // Refresh whatever is due; skip while the tab is hidden and catch up as soon as it's visible again.
    function tick() {
      if (!loc || document.hidden) return;
      const now = Date.now();
      if (now - alertsAt >= ALERTS_EVERY) refreshAlerts();
      if (now - forecastAt >= FORECAST_EVERY) refreshForecast();
    }
    setInterval(tick, 30 * 1000);
    document.addEventListener('visibilitychange', tick);

    function render() {
      const [icon, desc] = weather(lastData.current.weather_code);
      $('cur-icon').textContent = icon;
      $('cur-temp').textContent = `${fmt(lastData.current.temperature_2m)}°${unit}`;
      $('cur-desc').textContent = desc;
      $('cur-place').textContent = lastPlace;
      $('current').hidden = false;
      renderForecast(lastData.daily);
    }

    function renderForecast(d) {
      const min = Math.min(...d.temperature_2m_min), max = Math.max(...d.temperature_2m_max);
      const range = max - min || 1;
      $('forecast').innerHTML = d.time.map((t, i) => {
        const day = i === 0 ? 'Today' : new Date(t + 'T12:00').toLocaleDateString('en-US', { weekday: 'short' });
        const hi = d.temperature_2m_max[i], lo = d.temperature_2m_min[i];
        const top = ((max - hi) / range) * 100, height = ((hi - lo) / range) * 100;
        const [icon, desc] = weather(d.weather_code[i]);
        return `<div class="day" title="${desc}">
          <div>${day}</div>
          <div class="icon">${icon}</div>
          <div class="hi">${fmt(hi)}°</div>
          <div class="bar"><span style="top:${top}%;height:${Math.max(height, 4)}%"></span></div>
          <div class="lo">${fmt(lo)}°</div>
          <div class="precip">💧 ${d.precipitation_probability_max[i] ?? 0}%</div>
        </div>`;
      }).join('');
    }

    $('search').addEventListener('submit', async e => {
      e.preventDefault();
      const q = $('city').value.trim();
      if (!q) return;
      $('status').textContent = 'Searching…';
      const res = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1`)).json();
      const place = res.results?.[0];
      if (!place) { $('status').textContent = `No results for "${q}".`; return; }
      loadWeather(place.latitude, place.longitude, [place.name, place.admin1, place.country].filter(Boolean).join(', '));
    });

    // Start with the user's location, falling back to New York City.
    const fallback = () => loadWeather(40.7128, -74.006, 'New York, NY (default)');
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => loadWeather(pos.coords.latitude, pos.coords.longitude, 'Your location'),
        fallback, { timeout: 8000 }
      );
    } else {
      fallback();
    }
  </script>
</body>
</html>
